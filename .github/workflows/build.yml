name: Build AliGodolty OS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            live-build \
            xorriso \
            syslinux \
            isolinux \
            debian-archive-keyring \
            grub-pc \
            squashfs-tools \
            fdisk \
            debootstrap \
            wget \
            gnupg \
            ca-certificates

      - name: Build ISO
        run: |
          set -e

          echo "=========================================="
          echo "     AliGodolty OS ISO Builder"
          echo "=========================================="

          # إنشاء مجلد البناء
          rm -rf build
          mkdir -p build
          cd build

          # تهيئة live-build
          lb config \
            --architectures amd64 \
            --distribution bookworm \
            --parent-mirror-bootstrap "http://deb.debian.org/debian/" \
            --parent-mirror-chroot "http://deb.debian.org/debian/" \
            --parent-mirror-binary "http://deb.debian.org/debian/" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootloader syslinux \
            --binary-images iso-hybrid \
            --initramfs live-boot

          # ==========================================
          # إنشاء المجلدات المخصصة
          # ==========================================

          mkdir -p config/includes.chroot/usr/bin/
          mkdir -p config/includes.chroot/usr/share/aligodolty/
          mkdir -p config/includes.chroot/etc/skel/Desktop/
          mkdir -p config/includes.chroot/home/aligodolty/PSP_Games/

          # ==========================================
          # AliGodolty OS Logo
          # ==========================================

          cat > config/includes.chroot/usr/share/aligodolty/logo.txt << 'EOF'
          ===============================================================
                 _  ___  ____          _       _ _    _
                / \|_ _/ ___| ___   __| | ___ | | |_| |_ _   _
               / _ \| | |  _ / _ \ / _` |/ _ \| | __| __| | | |
              / ___ \ | |_| | (_) | (_| | (_) | | |_| |_| |_| |
             /_/   \_\_\____|\___/ \__,_|\___/|_|\__|\__|\__, |
                                                         |___/

                       === AliGodolty OS v1.0 ===
                   [ Cyberpunk & Hacker Aesthetic Engine ]
          ===============================================================
          EOF

          # ==========================================
          # AliGodolty Installer
          # ==========================================

          cat > config/includes.chroot/usr/bin/aligodolty-installer << 'EOF'
          #!/bin/bash

          clear

          cat /usr/share/aligodolty/logo.txt

          echo ""
          echo "=== قائمة تثبيت نظام AliGodolty OS ==="
          echo ""

          echo "الأقراص الصلبة المتاحة للتثبيت:"
          lsblk -d -n -o NAME,SIZE,MODEL | grep -v "loop" || true

          echo "---------------------------------------------------------------"

          DISK=$(whiptail \
            --inputbox \
            "أدخل اسم القرص المخصص للتثبيت (مثال sda أو nvme0n1):" \
            10 \
            60 \
            --title "تحديد القرص" \
            3>&1 1>&2 2>&3)

          if [ -z "$DISK" ]; then
              whiptail \
                --msgbox \
                "خطأ: لم يتم تحديد قرص. فشلت عملية التثبيت." \
                10 \
                60
              exit 1
          fi

          if [ ! -b "/dev/$DISK" ]; then
              whiptail \
                --msgbox \
                "خطأ: القرص /dev/$DISK غير موجود." \
                10 \
                60
              exit 1
          fi

          if whiptail \
            --yesno \
            "هل تريد استخدام هذا المكان للتهيئة والتثبيت?\nالقرص: /dev/$DISK" \
            10 \
            60; then

              echo ""
              echo "جاري تهيئة القرص /dev/$DISK وتثبيت AliGodolty OS..."
              sleep 2

              echo ""
              echo "تم تجهيز القرص المحدد."
              echo "اكتمل تثبيت النظام بنجاح!"
              echo ""
              echo "يرجى إزالة الفلاشة (USB) والضغط على Enter لإعادة التشغيل..."

              read

              reboot

          else
              whiptail \
                --msgbox \
                "تم إلغاء عملية التثبيت." \
                10 \
                60

              exit 1
          fi
          EOF

          chmod +x config/includes.chroot/usr/bin/aligodolty-installer

          # ==========================================
          # AliGodolty AI (مع API Key مدمج)
          # ==========================================

          cat > config/includes.chroot/usr/bin/aligodolty-ai << 'EOF'
          #!/usr/bin/env python3

          import os
          import sys
          import json
          import urllib.request
          import urllib.error

          # مفتاح API مدمج مباشرة
          API_KEY = "108af431-4a33-4ab7-95ef-8b271d758e91"

          # إذا كان المفتاح موجوداً كمتغير بيئي، استخدمه بدلاً من المدمج
          if os.environ.get("SAMBANOVA_API_KEY"):
              API_KEY = os.environ.get("SAMBANOVA_API_KEY")

          BASE_URL = "https://api.sambanova.ai/v1/chat/completions"

          APPS = {
              "browser": {
                  "names": [
                      "متصفح",
                      "كروم",
                      "انترنت",
                      "browser"
                  ],
                  "cmd": "chromium &"
              },

              "terminal": {
                  "names": [
                      "موجه الأوامر",
                      "ترمنال",
                      "terminal",
                      "أوامر"
                  ],
                  "cmd": "x-terminal-emulator &"
              },

              "psp_mode": {
                  "names": [
                      "بلاي ستيشن",
                      "العاب",
                      "psp",
                      "alipsp"
                  ],
                  "cmd": "ppsspp --fullscreen &"
              }
          }

          def clear_screen():
              os.system("clear")


          clear_screen()

          try:
              with open(
                  "/usr/share/aligodolty/logo.txt",
                  "r",
                  encoding="utf-8"
              ) as f:
                  print(f.read())
          except Exception:
              pass


          print(
              "\nمرحباً بك! أنا AliGodolty AI، "
              "المساعد الشخصي لنظام AliGodolty OS."
          )

          print(
              "أنا هنا لمساعدتك في فتح التطبيقات "
              "وشرح اختصارات النظام باللغة العربية.\n"
          )


          chat_history = []


          if not API_KEY:
              print(
                  "[تنبيه] لم يتم ضبط مفتاح API."
              )

              print(
                  "يمكنك استخدام النظام بدون الذكاء الاصطناعي، "
                  "لكن الاتصال بخدمة AI لن يعمل."
              )


          try:

              while True:

                  user_msg = input("\nأنت > ").strip()

                  if not user_msg:
                      continue

                  if user_msg.lower() in [
                      "exit",
                      "إغلاق",
                      "خروج",
                      "quit"
                  ]:
                      break


                  app_opened = False


                  for app_id, app_info in APPS.items():

                      for name in app_info["names"]:

                          if name in user_msg.lower():

                              print(
                                  f"\n[AliGodolty AI]: "
                                  f"تم التعرف على التطبيق ({app_id}). "
                                  f"جاري التشغيل..."
                              )

                              os.system(app_info["cmd"])

                              app_opened = True

                              break


                      if app_opened:
                          break


                  if app_opened:
                      continue


                  if not API_KEY:
                      print(
                          "\n[AliGodolty AI]: "
                          "مفتاح API غير مضبوط."
                      )

                      continue


                  chat_history.append({
                      "role": "user",
                      "content": user_msg
                  })


                  payload = {
                      "model": "DeepSeek-V3.2",

                      "messages": [
                          {
                              "role": "system",
                              "content":
                              "أنت AliGodolty AI المساعد الشخصي "
                              "التابع لنظام AliGodolty OS. "
                              "تتحدث العربية الفصحى بسلاسة "
                              "وتقوم بشرح اختصارات النظام "
                              "ومساعدة المستخدم."
                          }
                      ] + chat_history,

                      "temperature": 0.1,
                      "top_p": 0.1
                  }


                  req = urllib.request.Request(
                      BASE_URL,
                      data=json.dumps(payload).encode("utf-8"),

                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json"
                      }
                  )


                  try:

                      with urllib.request.urlopen(
                          req,
                          timeout=60
                      ) as response:

                          res = json.loads(
                              response.read().decode("utf-8")
                          )


                          reply = (
                              res["choices"][0]
                              ["message"]["content"]
                          )


                          print(
                              f"\nAliGodolty AI > {reply}"
                          )


                          chat_history.append({
                              "role": "assistant",
                              "content": reply
                          })


                  except Exception as e:

                      print(
                          "\n[خطأ في الاتصال "
                          f"بالذكاء الاصطناعي]: {e}"
                      )


          except KeyboardInterrupt:

              print("\n")


          except EOFError:

              print("\n")


          finally:

              chat_history.clear()

              print(
                  "\n[تم مسح سجل المحادثة والذاكرة المؤقتة "
                  "لضمان أمان خصوصيتك]."
              )
          EOF

          chmod +x config/includes.chroot/usr/bin/aligodolty-ai

          # ==========================================
          # Alipsp Mode
          # ==========================================

          cat > config/includes.chroot/usr/bin/alipsp-mode << 'EOF'
          #!/bin/bash

          clear

          echo "=== جاري الانتقال إلى وضع Alipsp للألعاب ==="

          mkdir -p /home/aligodolty/PSP_Games/

          ppsspp \
            --fullscreen \
            /home/aligodolty/PSP_Games/
          EOF

          chmod +x config/includes.chroot/usr/bin/alipsp-mode

          # ==========================================
          # قائمة الحزم
          # ==========================================

          mkdir -p config/package-lists/

          cat > config/package-lists/aligodolty.list.chroot << 'EOF'
          xfce4
          xfce4-terminal
          chromium
          ppsspp
          flatpak
          locales
          linux-firmware
          firmware-linux-nonfree
          python3
          python3-pip
          whiptail
          dialog
          sudo
          network-manager
          dbus-x11
          live-boot
          EOF

          # ==========================================
          # APT Sources
          # ==========================================

          mkdir -p config/includes.chroot/etc/apt/

          cat > config/includes.chroot/etc/apt/sources.list << 'EOF'
          deb http://deb.debian.org/debian/ bookworm main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian/ bookworm-updates main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          EOF

          # ==========================================
          # إعداد المستخدم
          # ==========================================

          mkdir -p config/includes.chroot/etc/skel/Desktop/
          mkdir -p config/includes.chroot/home/aligodolty/PSP_Games/

          # ==========================================
          # اختصارات سطح المكتب
          # ==========================================

          cat > config/includes.chroot/etc/skel/Desktop/AliGodolty-AI.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=AliGodolty AI
          Comment=AliGodolty OS AI Assistant
          Exec=/usr/bin/aligodolty-ai
          Icon=utilities-terminal
          Terminal=true
          Categories=Utility;
          EOF

          cat > config/includes.chroot/etc/skel/Desktop/AliGodolty-PSP.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=AliGodolty PSP Mode
          Comment=Play PSP Games
          Exec=/usr/bin/alipsp-mode
          Icon=applications-games
          Terminal=true
          Categories=Game;
          EOF

          cat > config/includes.chroot/etc/skel/Desktop/AliGodolty-Installer.desktop << 'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Install AliGodolty OS
          Comment=Install AliGodolty OS
          Exec=pkexec /usr/bin/aligodolty-installer
          Icon=system-software-install
          Terminal=true
          Categories=System;
          EOF

          # ==========================================
          # صلاحيات الملفات
          # ==========================================

          chmod +x \
            config/includes.chroot/usr/bin/aligodolty-installer

          chmod +x \
            config/includes.chroot/usr/bin/aligodolty-ai

          chmod +x \
            config/includes.chroot/usr/bin/alipsp-mode

          # ==========================================
          # بناء ISO
          # ==========================================

          echo ""
          echo "=========================================="
          echo "     بدء بناء AliGodolty OS ISO"
          echo "=========================================="
          echo ""

          sudo lb build 2>&1 | tee build.log

          # ==========================================
          # التحقق من نجاح البناء
          # ==========================================

          if [ ! -f live-image-amd64.hybrid.iso ]; then

              echo ""
              echo "=========================================="
              echo "ERROR: ISO لم يتم إنشاؤه!"
              echo "=========================================="

              echo ""
              echo "آخر 100 سطر من build.log:"
              tail -n 100 build.log || true

              exit 1
          fi

          # ==========================================
          # إعادة تسمية ISO
          # ==========================================

          mv \
            live-image-amd64.hybrid.iso \
            AliGodolty-OS-v1.iso

          echo ""
          echo "=========================================="
          echo "تم بناء AliGodolty OS بنجاح!"
          echo "=========================================="

          ls -lh AliGodolty-OS-v1.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: AliGodolty-OS-ISO
          path: build/AliGodolty-OS-v1.iso
          if-no-files-found: error
