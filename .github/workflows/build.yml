name: Build AliGodolty OS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Install Dependencies
      run: |
        sudo apt-get update
        # نثبت grub-pc فقط (بدون grub-efi-amd64) لتجنب التعارض
        sudo apt-get install -y live-build xorriso syslinux isolinux \
          debian-archive-keyring grub-pc squashfs-tools fdisk
        
        # استيراد مفتاح Debian bookworm
        wget -O /usr/share/keyrings/debian-archive-bookworm-stable.gpg \
          https://ftp-master.debian.org/keys/archive-key-12.asc
        sudo gpg --no-default-keyring \
          --keyring /usr/share/keyrings/debian-archive-keyring.gpg \
          --import /usr/share/keyrings/debian-archive-bookworm-stable.gpg
      
    - name: Build ISO
      run: |
        # إنشاء مجلد build
        mkdir -p build && cd build
        
        # تهيئة lb config (مع syslinux بدلاً من grub-efi)
        lb config --architectures amd64 \
          --distribution bookworm \
          --parent-mirror-bootstrap "http://deb.debian.org/debian/" \
          --parent-mirror-chroot "http://deb.debian.org/debian/" \
          --parent-mirror-binary "http://deb.debian.org/debian/" \
          --mirror-bootstrap "http://deb.debian.org/debian/" \
          --mirror-chroot "http://deb.debian.org/debian/" \
          --mirror-binary "http://deb.debian.org/debian/" \
          --archive-areas "main contrib non-free non-free-firmware" \
          --bootloader syslinux \
          --binary-images iso-hybrid \
          --initramfs "live-boot"
        
        # إضافة ملفاتك المخصصة
        mkdir -p config/includes.chroot/usr/bin/
        mkdir -p config/includes.chroot/usr/share/aligodolty/
        mkdir -p config/includes.chroot/etc/skel/Desktop/
        mkdir -p config/includes.chroot/home/aligodolty/PSP_Games/
        
        # أضف logo
        cat > config/includes.chroot/usr/share/aligodolty/logo.txt << 'EOF'
        ===============================================================
               _  ___  ____          _       _ _    _        
              / \|_ _/ ___| ___   __| | ___ | | |_| |_ _   _ 
             / _ \| | |  _ / _ \ / _` |/ _ \| | __| __| | | |
            / ___ \ | |_| | (_) | (_| | (_) | | |_| |_| |_| |
           /_/   \_\_\____|\___/ \__,_|\___/|_|\__|\__|\__, |
                                                       |___/ 
                     === AliGodolty OS v1.0 ===
                 [ Cyberpunk & Hacker Aesthetic Engine ]
        ===============================================================
        EOF
        
        # أضف المثبت
        cat > config/includes.chroot/usr/bin/aligodolty-installer << 'EOF'
        #!/bin/bash
        clear
        cat /usr/share/aligodolty/logo.txt
        echo ""
        echo "=== قائمة تثبيت نظام AliGodolty OS ==="
        echo "الأقراص الصلبة المتاحة للتثبيت:"
        lsblk -d -n -o NAME,SIZE,MODEL | grep -v "loop"
        echo "---------------------------------------------------------------"
        DISK=$(whiptail --inputbox "أدخل اسم القرص المخصص للتثبيت (مثال sda أو nvme0n1):" 10 60 --title "تحديد القرص" 3>&1 1>&2 2>&3)
        if [ -z "$DISK" ]; then
            whiptail --msgbox "خطأ: لم يتم تحديد قرص. فشلت عملية التثبيت." 10 60
            exit 1
        fi
        if whiptail --yesno "هل تريد استخدام هذا المكان للتهيئة والتثبيت?\nالقرص: /dev/$DISK" 10 60; then
            echo "جاري تهيئة القرص /dev/$DISK وتثبيت AliGodolty OS..."
            sleep 2
            echo "اكتمل تثبيت النظام بنجاح!"
            echo "يرجى إزالة الفلاشة (USB) والضغط على Enter لإعادة التشغيل..."
            read
            reboot
        else
            whiptail --msgbox "تم إلغاء عملية التثبيت." 10 60
            exit 1
        fi
        EOF
        chmod +x config/includes.chroot/usr/bin/aligodolty-installer
        
        # أضف AI
        cat > config/includes.chroot/usr/bin/aligodolty-ai << 'EOF'
        #!/usr/bin/env python3
        import os, sys, json, urllib.request
        API_KEY = "108af431-4a33-4ab7-95ef-8b271d758e91"
        BASE_URL = "https://api.sambanova.ai/v1/chat/completions"
        APPS = {
            "browser": {"names": ["متصفح", "كروم", "انترنت", "browser"], "cmd": "chromium &"},
            "terminal": {"names": ["موجه الأوامر", "ترمنال", "terminal", "أوامر"], "cmd": "x-terminal-emulator &"},
            "psp_mode": {"names": ["بلاي ستيشن", "العاب", "psp", "alipsp"], "cmd": "ppsspp --fullscreen &"}
        }
        def clear_screen(): os.system('clear')
        clear_screen()
        with open('/usr/share/aligodolty/logo.txt', 'r') as f: print(f.read())
        print("\\nمرحباً بك! أنا AliGodolty AI، المساعد الشخصي لنظام AliGodolty OS.")
        print("أنا هنا لمساعدتك في فتح التطبيقات وشرح اختصارات النظام باللغة العربية.\\n")
        chat_history=[]
        try:
            while True:
                user_msg=input("\\nأنت > ").strip()
                if not user_msg: continue
                if user_msg.lower() in ['exit', 'إغلاق', 'خروج', 'quit']: break
                app_opened=False
                for app_id, app_info in APPS.items():
                    for name in app_info["names"]:
                        if name in user_msg.lower():
                            print(f"\\n[AliGodolty AI]: تم التعرف على التطبيق ({app_id}). جاري التشغيل...")
                            os.system(app_info["cmd"])
                            app_opened=True
                            break
                    if app_opened: break
                if app_opened: continue
                chat_history.append({"role": "user", "content": user_msg})
                payload = {"model": "DeepSeek-V3.2", "messages": [{"role": "system", "content": "أنت AliGodolty AI المساعد الشخصي التابع لنظام AliGodolty OS. تتحدث العربية الفصحى بسلاسة وتقوم بشرح اختصارات النظام ومساعدة المستخدم."}]+chat_history, "temperature":0.1, "top_p":0.1}
                req = urllib.request.Request(BASE_URL, data=json.dumps(payload).encode('utf-8'), headers={"Authorization": f"Bearer {API_KEY}", "Content-Type": "application/json"})
                try:
                    with urllib.request.urlopen(req) as response:
                        res = json.loads(response.read().decode('utf-8'))
                        reply = res['choices'][0]['message']['content']
                        print(f"\\nAliGodolty AI > {reply}")
                        chat_history.append({"role": "assistant", "content": reply})
                except Exception as e: print(f"\\n[خطأ في الاتصال بالذكاء الاصطناعي]: {e}")
        finally:
            chat_history.clear()
            print("\\n[تم مسح سجل المحادثة والذاكرة المؤقتة لضمان أمان خصوصيتك].")
        EOF
        chmod +x config/includes.chroot/usr/bin/aligodolty-ai
        
        # أضف Alipsp Mode
        cat > config/includes.chroot/usr/bin/alipsp-mode << 'EOF'
        #!/bin/bash
        clear
        echo "=== جاري الانتقال إلى وضع Alipsp للألعاب ==="
        ppsspp --fullscreen /home/aligodolty/PSP_Games/
        EOF
        chmod +x config/includes.chroot/usr/bin/alipsp-mode
        
        # قائمة الحزم
        mkdir -p config/package-lists/
        cat > config/package-lists/aligodolty.list.chroot << 'EOF'
        xfce4
        xfce4-terminal
        chromium
        ppsspp
        flatpak
        locales
        linux-firmware
        firmware-linux-nonfree
        python3
        python3-pip
        whiptail
        dialog
        EOF
        
        # sources.list
        mkdir -p config/includes.chroot/etc/apt/
        cat > config/includes.chroot/etc/apt/sources.list << 'EOF'
        deb http://deb.debian.org/debian/ bookworm main contrib non-free non-free-firmware
        deb http://deb.debian.org/debian/ bookworm-updates main contrib non-free non-free-firmware
        deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
        EOF
        
        # بناء الـ ISO
        sudo lb build 2>&1 | tee build.log
        
        # إعادة تسمية الملف
        if [ -f live-image-amd64.hybrid.iso ]; then
          mv live-image-amd64.hybrid.iso AliGodolty-OS-v1.iso
        fi
      
    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: AliGodolty-OS-ISO
        path: build/AliGodolty-OS-v1.iso
